name: tests

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Luau
        run: |
          curl -sSL -o luau.zip https://github.com/luau-lang/luau/releases/download/0.700/luau-ubuntu.zip
          unzip -q luau.zip -d "$HOME/luau"
          echo "$HOME/luau" >> "$GITHUB_PATH"
      - name: Type-check and lint the engine
        run: luau-analyze src/server/Combat/*.luau src/shared/Data/*.luau tests/*.luau
      - name: Run engine tests
        run: luau tests/run.luau
